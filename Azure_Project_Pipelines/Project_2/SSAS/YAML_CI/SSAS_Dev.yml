# DevOps CI/CD Pipeline

name: $(Build.DefinitionName)_$(Build.BuildId)
trigger:
  branches:
    include:
    - development
  paths:
    include:
    - SSAS/*

stages:
- stage: Build
  displayName: Development
  jobs:
   - job: Build
     displayName: SSAS
     timeoutInMinutes: 20
     pool:
       vmImage: 'windows-latest'

     steps:
        - task: ArchiveFiles@2
          displayName: 'Archive Files'
          inputs:
            rootFolderOrFile: '$(System.DefaultWorkingDirectory)/SSAS/Model.bim'
            archiveType: zip
            archiveFile: '$(System.DefaultWorkingDirectory)/SSAS.zip'
            replaceExistingArchive: true

        - publish: $(System.DefaultWorkingDirectory)/SSAS.zip
          displayName: 'Publish artifact'
          artifact: SSAS

## Read Values from KeyVault
        - task: AzureKeyVault@1
          displayName: 'Azure Dev KeyVault'
          inputs:
            azureSubscription: 'ACS_Food_Solution_Dev_SPN'
            KeyVaultName: 'bnlwe-fr01-n-56690-kv-02'

## Deploy SSAS
        - task: deploy-aas-db@1
          displayName: 'Deploy Model'
          inputs:
            connectedServiceNameARM: 'ACS_Food_Solution_Dev_SPN'
            aasServer: 'asazure://westeurope.asazure.windows.net/bnlwefr01d56690pa01aasdev01'
            databaseName: 'bnlwe-fr01-d-56690-pa01-aasdb-dev-01'
            loginType: spn
            tenantId: $(TenantId)
            appId: $(AppId)
            appKey: $(AppKey)
            pathToModel: '$(System.DefaultWorkingDirectory)/SSAS/Model.bim'
            partitionDeployment: deploypartitions
            roleDeployment: deployrolesandmembers
            connectionType: sql
            sourceSQLServer:  $(ssassqlserver)
            sourceSQLDatabase: $(dbname)
            sourceSQLUsername: $(DEVSSISUSERNAME)
            sourceSQLPassword: $(DEVSSISPASSWORD)
####
- stage: Archive
  dependsOn: Build
  jobs:
    - job: DownloadArtifact
      displayName: 'Download Artifact'
      pool: 
       vmImage: 'ubuntu-latest'
      steps:
       - template: ../../preliminary-steps.yml
         parameters:
            cicdChain: 'CI'
            infoPath: 'info.yaml'
            env: 'SSASDEV'

## TAG RESOURCES
       - task: AzureCLI@2
         displayName: 'Tagging SSAS on Azure Cloud'
         continueOnError: false
         inputs:
          azureSubscription: 'ACS_Food_Solution_Dev_SPN'
          scriptLocation: 'inlineScript'
          scriptType: 'bash'
          inlineScript: |
            set -euovx pipefail
            echo -e "\e[1mWriting resource tag on Azure\e[0m"
            az tag create \
            --resource-id /subscriptions/$(azureSubscription)/resourceGroups/$(resgroup)/providers/Microsoft.AnalysisServices/servers/$(ssasserver) \
            --tags version=$(newVersion)