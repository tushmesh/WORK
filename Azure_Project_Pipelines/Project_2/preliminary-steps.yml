           arfname=$(scripts/python/shyaml get-value "${{parameters.env}}.arfname" < "${{parameters.infoPath}}")
           echo "##vso[task.setvariable variable=website]${website}"
           echo "##vso[task.setvariable variable=arfname]${arfname}"
        fi
        if [[ "${{parameters.env}}" == "SSASDEV" ]]; then           
           ssasserver=$(scripts/python/shyaml get-value "${{parameters.env}}.ssasserver" < "${{parameters.infoPath}}")
           arfname=$(scripts/python/shyaml get-value "${{parameters.env}}.arfname" < "${{parameters.infoPath}}")
           dbname=$(scripts/python/shyaml get-value "${{parameters.env}}.dbname" < "${{parameters.infoPath}}")
           ssassqlserver=$(scripts/python/shyaml get-value "${{parameters.env}}.ssassqlserver" < "${{parameters.infoPath}}")
           echo "##vso[task.setvariable variable=ssasserver]${ssasserver}"
           echo "##vso[task.setvariable variable=arfname]${arfname}"
           echo "##vso[task.setvariable variable=dbname]${dbname}"
           echo "##vso[task.setvariable variable=ssassqlserver]${ssassqlserver}" 
        fi

        if [[ "${{parameters.env}}" == "SSASQA" ]]; then           
           ssasserver=$(scripts/python/shyaml get-value "${{parameters.env}}.ssasserver" < "${{parameters.infoPath}}")
           arfname=$(scripts/python/shyaml get-value "${{parameters.env}}.arfname" < "${{parameters.infoPath}}")
           dbname=$(scripts/python/shyaml get-value "${{parameters.env}}.dbname" < "${{parameters.infoPath}}")
           ssassqlserver=$(scripts/python/shyaml get-value "${{parameters.env}}.ssassqlserver" < "${{parameters.infoPath}}")
           echo "##vso[task.setvariable variable=ssasserver]${ssasserver}"
