           echo "##vso[task.setvariable variable=DataFactoryName]${DataFactoryName}"
           echo "##vso[task.setvariable variable=dataFactory_location]${dataFactory_location}"
           echo "##vso[task.setvariable variable=arfname]${arfname}"
        fi
        if [[ "${{parameters.env}}" == "LA_GLO_Dev_Cn_01" ]]; then
           arfname=$(scripts/python/shyaml get-value "${{parameters.env}}.arfname" < "${{parameters.infoPath}}")
           echo "##vso[task.setvariable variable=arfname]${arfname}"
        fi
        if [[ "${{parameters.env}}" == "LA_GLO_QA_Cn_01" ]]; then
           arfname=$(scripts/python/shyaml get-value "${{parameters.env}}.arfname" < "${{parameters.infoPath}}")
           echo "##vso[task.setvariable variable=arfname]${arfname}"
        fi
        if [[ "${{parameters.env}}" == "LA_GLO_PRD_Cn_01" ]]; then
           arfname=$(scripts/python/shyaml get-value "${{parameters.env}}.arfname" < "${{parameters.infoPath}}")
           echo "##vso[task.setvariable variable=arfname]${arfname}"
        fi
        if [[ "${{parameters.env}}" == "LA_GLO_Dev_Cn_02" ]]; then
           arfname=$(scripts/python/shyaml get-value "${{parameters.env}}.arfname" < "${{parameters.infoPath}}")
           echo "##vso[task.setvariable variable=arfname]${arfname}"
