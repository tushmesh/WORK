           arfname=$(scripts/python/shyaml get-value "${{parameters.env}}.arfname" < "${{parameters.infoPath}}")
           echo "##vso[task.setvariable variable=dbname]${dbname}"
           echo "##vso[task.setvariable variable=arfname]${arfname}"
        fi
        
