parameters:
  - name: cicdChain
    type: string
  - name: infoPath
    type: string
  - name: env
    type: string

steps:
  - task: CmdLine@2
    displayName: "Preliminary Steps"
    continueOnError: false
    inputs:
      script: |
        set -euo pipefail
        echo -e "\e[1mEnsuring unix-like source files termination\e[0m"
        cd $(Build.SourcesDirectory)/Deployment/YAML/
        find scripts -type f -exec chmod +x {} \;
        #find $(Build.SourcesDirectory)/ -type f -print0 | xargs -0 dos2unix
        echo -e "\e[1mInitializing python virtual environment\e[0m"
        #python3.9 -m venv .localPy3Env
        #source .localPy3Env/bin/activate
        python -m pip install --upgrade pip
        python -m pip install -r scripts/python/requirements.txt
        echo -e "\e[1mReading informations from ${{parameters.infoPath}}\e[0m"
        currentRelease=$(scripts/python/shyaml get-value "currentRelease" < "${{parameters.infoPath}}")
        orgname=$(scripts/python/shyaml get-value "AZ_ORG_NAME" < "${{parameters.infoPath}}")
        prgname=$(scripts/python/shyaml get-value "AZ_PRJ_NAME" < "${{parameters.infoPath}}")
        repo=$(scripts/python/shyaml get-value "git-repo" < "${{parameters.infoPath}}")
        azureSubscription=$(scripts/python/shyaml get-value "azureSubscription" < "${{parameters.infoPath}}")
        feed=$(scripts/python/shyaml get-value "feed" < "${{parameters.infoPath}}")
        tennantId=$(scripts/python/shyaml get-value "tennantId" < "${{parameters.infoPath}}")
        resgroup=$(scripts/python/shyaml get-value "resourceGroup" < "${{parameters.infoPath}}")
        prdresgroup=$(scripts/python/shyaml get-value "prdresourceGroup" < "${{parameters.infoPath}}")
        devservername=$(scripts/python/shyaml get-value "devservername" < "${{parameters.infoPath}}")
        devsqlserver=$(scripts/python/shyaml get-value "devsqlserver" < "${{parameters.infoPath}}")
        qasqlserver=$(scripts/python/shyaml get-value "qasqlserver" < "${{parameters.infoPath}}")
        prdsqlserver=$(scripts/python/shyaml get-value "prdsqlserver" < "${{parameters.infoPath}}")

        if [[ "${{parameters.env}}" == "SSISDEV" ]]; then
           ssisserver=$(scripts/python/shyaml get-value "${{parameters.env}}.ssisserver" < "${{parameters.infoPath}}")
           ssisdb=$(scripts/python/shyaml get-value "${{parameters.env}}.ssisdb" < "${{parameters.infoPath}}")
           arfname=$(scripts/python/shyaml get-value "${{parameters.env}}.arfname" < "${{parameters.infoPath}}")
           echo "##vso[task.setvariable variable=ssisserver]${ssisserver}"
           echo "##vso[task.setvariable variable=ssisdb]${ssisdb}"
           echo "##vso[task.setvariable variable=arfname]${arfname}"
        fi

        if [[ "${{parameters.env}}" == "SSISQA" ]]; then
           ssisserver=$(scripts/python/shyaml get-value "${{parameters.env}}.ssisserver" < "${{parameters.infoPath}}")
           ssisdb=$(scripts/python/shyaml get-value "${{parameters.env}}.ssisdb" < "${{parameters.infoPath}}")
           arfname=$(scripts/python/shyaml get-value "${{parameters.env}}.arfname" < "${{parameters.infoPath}}")
           echo "##vso[task.setvariable variable=ssisserver]${ssisserver}"
           echo "##vso[task.setvariable variable=ssisdb]${ssisdb}"
           echo "##vso[task.setvariable variable=arfname]${arfname}"
        fi
        if [[ "${{parameters.env}}" == "SSISPRD" ]]; then
           ssisserver=$(scripts/python/shyaml get-value "${{parameters.env}}.ssisserver" < "${{parameters.infoPath}}")
           ssisdb=$(scripts/python/shyaml get-value "${{parameters.env}}.ssisdb" < "${{parameters.infoPath}}")
           arfname=$(scripts/python/shyaml get-value "${{parameters.env}}.arfname" < "${{parameters.infoPath}}")
           echo "##vso[task.setvariable variable=ssisserver]${ssisserver}"
           echo "##vso[task.setvariable variable=ssisdb]${ssisdb}"
           echo "##vso[task.setvariable variable=arfname]${arfname}"
        fi
        if [[ "${{parameters.env}}" == "ADFDEV" ]]; then
           DataFactoryName=$(scripts/python/shyaml get-value "${{parameters.env}}.DataFactoryName" < "${{parameters.infoPath}}")
           dataFactory_location=$(scripts/python/shyaml get-value "${{parameters.env}}.dataFactory_location" < "${{parameters.infoPath}}")
           arfname=$(scripts/python/shyaml get-value "${{parameters.env}}.arfname" < "${{parameters.infoPath}}")
           echo "##vso[task.setvariable variable=DataFactoryName]${DataFactoryName}"
           echo "##vso[task.setvariable variable=dataFactory_location]${dataFactory_location}"
           echo "##vso[task.setvariable variable=arfname]${arfname}"
        fi
        if [[ "${{parameters.env}}" == "ADFQA" ]]; then
