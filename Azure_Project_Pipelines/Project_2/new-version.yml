  - task: CmdLine@2
    displayName: 'Calculating new version'
    continueOnError: false
    inputs:
      script: |
        set -euo pipefail
        cd $(Build.SourcesDirectory)/Deployment/YAML/
        echo -e "\e[1mCalculating new Azure Cloud version\e[0m"
        declare -a TAGLIST
        newVersionType=$(cat .newVersionType)
        #source .localPy3Env/bin/activate
        python scripts/python/read_az_version_tag.py
        if [[ "$(cat taglist.lst)" == "None" ]]; then
          new_version="1.0.0"
        else
          currVer=$(cat taglist.lst)
          new_version="$(python scripts/python/get_new_version.py --versions ${currVer} --type $newVersionType --sprint $(currentRelease))"
        fi
        echo -e "\e[1mNew calculated version is: $new_version\e[0m"
        echo "$new_version" | tee .new_version
