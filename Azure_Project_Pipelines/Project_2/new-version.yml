parameters:
  - name: env
    type: string
steps:
  - task: CmdLine@2
    continueOnError: false
    displayName: 'Version Type identification'
    inputs:
      script: |
        set -euo pipefail
        cd $(Build.SourcesDirectory)/Deployment/YAML/
        echo -e "\e[1mCalculating version type minor/fix\e[0m"
        #source .localPy3Env/bin/activate
        newVersionType=""
        new_version=""
        case $(Build.SourceBranchName) in

          develop)
             newVersionType="minor"
            ;;
          hotfix/*)
            newVersionType="fix"
            ;;
          releasefix/*)
            newVersionType="fix"
            ;;
          release/*)
            newVersionType="minor"
            ;;
          *)
            newVersionType="minor"
            ;;
        esac
        echo "$newVersionType" | tee .newVersionType


  - ${{ if eq(parameters.env, 'SSISDEV') }}:
    - task: AzureCLI@2
      displayName: 'Reading Azure Cloud version tag'
      continueOnError: false
      inputs:
        azureSubscription: 'ACS_Food_Solution_Dev_SPN'
        scriptLocation: 'inlineScript'
        scriptType: 'bash'
        inlineScript: |
            set -euovx pipefail
            cd $(Build.SourcesDirectory)/Deployment/YAML/
            echo -e "\e[1mReading resource tag on Azure\e[0m"
            az tag list \
              --resource-id /subscriptions/$(azureSubscription)/resourceGroups/$(resgroup)/providers/Microsoft.Sql/servers/$(ssisserver)/databases/$(ssisdb) | tee .response

