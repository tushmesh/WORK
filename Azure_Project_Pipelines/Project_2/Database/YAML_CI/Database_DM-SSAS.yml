# DevOps CI  Pipeline

trigger:
  branches:
    include:
    - development
  paths:
    include:
    - Database/UFS_DM/*

stages:
- stage: Build
  displayName: Build
  jobs:

  - job: Build
    displayName: Build
    timeoutInMinutes: 20
    pool:
      vmImage: 'windows-latest'
      demands:
      - msbuild
      - sqlpackage
    steps:

## Keyvault
     - task: AzureKeyVault@1
       displayName: 'Azure Dev KeyVault'
       inputs:
        azureSubscription: 'ACS_Food_Solution_Dev_SPN'
        KeyVaultName: 'bnlwe-fr01-n-56690-kv-02'

## Replace the value
     - task: cmdLine@2
       displayName: 'Replace values'
       inputs:
        script: |
          sed -i "s/USER_NAME/$(DEVSSISUSERNAME)/" $(System.DefaultWorkingDirectory)/Database/UFS_DM/Security/*.sql
          sed -i "s/PASS_WORD/$(DEVSSISPASSWORD)/" $(System.DefaultWorkingDirectory)/Database/UFS_DM/Security/*.sql
          sed -i "s/DBMASTERKEYPWD/$(DBMASTERKEYPWD)/g" $(System.DefaultWorkingDirectory)/Database/UFS_DM/Security/*.sql

 ## Compilation for UFS_DM
     - task: MSBuild@1
       displayName: 'MS Build'
       inputs:
        solution: $(System.DefaultWorkingDirectory)/Database/UFS_DM/*.sqlproj

## Archive for UFS_DM
     - task: ArchiveFiles@2
       inputs:
        rootFolderOrFile: '$(System.DefaultWorkingDirectory)/Database/UFS_DM/bin/Debug/UFS_DM.dacpac'
        includeRootFolder: true
        archiveType: 'zip'
        archiveFile: '$(System.DefaultWorkingDirectory)/DM.zip'
        replaceExistingArchive: true

## DM Publish              
     - publish: $(System.DefaultWorkingDirectory)/DM.zip
       displayName: 'Publish dacpac'
       artifact: 'UFS_DM'
## Deploy DM
     - task: SqlAzureDacpacDeployment@1
       displayName: 'Azure SQL DM Dacpac Task'
       inputs:
         azureSubscription: ACS_Food_Solution_Dev_SPN
         ServerName: 'bnlwe-fr01-d-56690-pa01-sql-dev-01.database.windows.net'
         DatabaseName: 'bnlwe-fr01-d-56690-pa01-sqldb-dev-01'
         SqlUsername: $(DEVSSISUSERNAME)
         SqlPassword: $(DEVSSISPASSWORD)
         DacpacFile: $(System.DefaultWorkingDirectory)/Database/UFS_DM/bin/Debug/UFS_DM.dacpac

#################
- stage: Archive
  dependsOn: Build
  jobs:
    - job: DownloadArtifact
      displayName: 'Download Artifact'
      pool: 
       vmImage: 'ubuntu-latest'
      steps:
       - template: ../../preliminary-steps.yml
         parameters:
            cicdChain: 'CI'
            infoPath: 'info.yaml'
            env: 'SQLDMDEV'
            
 ## TAG Resources               
       - task: AzureCLI@2
         displayName: 'Tagging SQL DB on Azure Cloud'
         continueOnError: false
         inputs:
            azureSubscription: 'ACS_Food_Solution_Dev_SPN'
            scriptLocation: 'inlineScript'
            scriptType: 'bash'
            inlineScript: |
              set -euovx pipefail
              echo -e "\e[1mWriting resource tag on Azure\e[0m"
              az tag create \
              --resource-id /subscriptions/$(azureSubscription)/resourceGroups/$(resgroup)/providers/Microsoft.Sql/servers/$(devsqlserver)/databases/$(dbname) \
              --tags version=$(newVersion)
