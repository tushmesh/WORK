steps:     

  - task: CmdLine@2
    continueOnError: false
    displayName: "Install FunctionApp Libraries"
    inputs:
      script: |
        set -euo pipefail
        echo -e "\e[1mInitializing python virtual environment\e[0m"
        python3.9 -m venv .localPy3Env
        source .localPy3Env/bin/activate
        python -m pip install --upgrade pip
        if [[ -f $(Build.SourcesDirectory)/sources/$(microservice)/FunctionApp/requirements.txt ]]; then
            python -m pip install --target="$(Build.SourcesDirectory)/.python_packages/lib/site-packages" -r $(Build.SourcesDirectory)/sources/$(microservice)/FunctionApp/requirements.txt
        fi  
        
  - task: CmdLine@2
    continueOnError: false
    displayName: "Creating artifact"
    inputs:
      script: |
        set -euo pipefail
        echo -e "\e[1mPreparing artifact folder\e[0m"
        pwd
        rm -rf package-databricks
        rm -rf package-functionapp
        rm -rf $(Build.SourcesDirectory)/$(packagePrefix)
        mkdir package-databricks
        mkdir -p $(Build.SourcesDirectory)/$(packagePrefix)
        mv $(Build.SourcesDirectory)/variables.py $(Build.SourcesDirectory)/sources/$(microservice)/Databricks/Functions
        cp -vRf $(Build.SourcesDirectory)/sources/$(microservice)/Databricks/* package-databricks
        cp -vRf $(Build.SourcesDirectory)/sources/$(microservice)/Databricks/$(microservice).py $(Build.SourcesDirectory)/$(packagePrefix)
        echo -e "\e[1mPreparing FunctionApp artifact folder\e[0m"
        mkdir package-functionapp
        cp -Rf $(Build.SourcesDirectory)/sources/$(microservice)/FunctionApp/* package-functionapp
        cp -Rf $(Build.SourcesDirectory)/.python_packages/ package-functionapp
        cd package-databricks
        zip -r $(packagePrefix)-databricks.zip *
        zipinfo  -tl $(packagePrefix)-databricks.zip
        cd ..
        echo -e "\e[1mCreating Function App artifact\e[0m"
        cd package-functionapp
        zip -r $(packagePrefix)-functionapp.zip .
        zipinfo -tl $(packagePrefix)-functionapp.zip
        cd ..
        mkdir -p $(Build.SourcesDirectory)/artifact
        cd $(Build.SourcesDirectory)/artifact
        mv $(Build.SourcesDirectory)/package-databricks/$(packagePrefix)-databricks.zip .
        mv $(Build.SourcesDirectory)/package-functionapp/$(packagePrefix)-functionapp.zip .
        cp $(Build.SourcesDirectory)/info.yaml .
        zip -FSr $(packagePrefix)_verify_updated.zip *
        mkdir updatedartifact
        mv $(packagePrefix)_verify_updated.zip updatedartifact/
        


  - task: CmdLine@2
    displayName: "Set Variable"
    inputs:
      script: |
        echo ${SYS_ACCESS_TOKEN} | az devops login
        az devops configure --defaults organization=$(AZ_ORG_NAME) project=$(AZ_PRJ_NAME) --use-git-aliases true
        az artifacts universal download --organization $(AZ_ORG_NAME) --project $(AZ_PRJ_NAME) --scope project --feed $(feed) --name $(packagePrefix) --version "*" --path . > $(Build.SourcesDirectory)/file.json                
        varstore=`cat $(Build.SourcesDirectory)/file.json | grep Version |cut -d '"' -f 4`
        echo $varstore
        echo "##vso[task.setvariable variable=varstoretodisplay;]$varstore"
    env:
      SYS_ACCESS_TOKEN: $(System.AccessToken)
         
     
  - task: CmdLine@2
    continueOnError: false
    displayName: 'Publishing artifact'
    env:
      SYS_ACCESS_TOKEN: $(System.AccessToken)
    inputs:
      script: |
        
        if [ "$(varstoretodisplay)" == "$(newVersion)" ]; then
          echo "Same Version as of deployed"
        else
          case $(Build.SourceBranchName) in
            develop)
                set -euo pipefail
                echo -e "\e[1mLogging into Azure Devops\e[0m"
                az config set extension.use_dynamic_install=yes_without_prompt
                echo ${SYS_ACCESS_TOKEN} | az devops login
                az devops configure --defaults organization=$(AZ_ORG_NAME) project=$(AZ_PRJ_NAME) --use-git-aliases true
                echo -e "\e[1mPublishing $(packagePrefix).zip artifact to feed $(feed)\e[0m"
                az artifacts universal publish --organization $(AZ_ORG_NAME) \
                  --project=$(AZ_PRJ_NAME) \
                  --feed $(feed) --name $(packagePrefix) \
                  --version $(newVersion) --scope project \
                  --path $(Build.SourcesDirectory)/artifact/updatedartifact/
                ;;
            hotfix/*)
                set -euo pipefail
                echo -e "\e[1mLogging into Azure Devops\e[0m"
                az config set extension.use_dynamic_install=yes_without_prompt
                echo ${SYS_ACCESS_TOKEN} | az devops login
                az devops configure --defaults organization=$(AZ_ORG_NAME) project=$(AZ_PRJ_NAME) --use-git-aliases true
                echo -e "\e[1mPublishing $(packagePrefix).zip artifact to feed $(feed)\e[0m"
                az artifacts universal publish --organization $(AZ_ORG_NAME) \
                  --project=$(AZ_PRJ_NAME) \
                  --feed $(feed) --name $(packagePrefix) \
                  --version $(newVersion) --scope project \
                  --path $(Build.SourcesDirectory)/artifact/updatedartifact/
                ;;
            releasefix/*)
                set -euo pipefail
                echo -e "\e[1mLogging into Azure Devops\e[0m"
                az config set extension.use_dynamic_install=yes_without_prompt
                echo ${SYS_ACCESS_TOKEN} | az devops login
                az devops configure --defaults organization=$(AZ_ORG_NAME) project=$(AZ_PRJ_NAME) --use-git-aliases true
                echo -e "\e[1mPublishing $(packagePrefix).zip artifact to feed $(feed)\e[0m"
                az artifacts universal publish --organization $(AZ_ORG_NAME) \
                  --project=$(AZ_PRJ_NAME) \
                  --feed $(feed) --name $(packagePrefix) \
                  --version $(newVersion) --scope project \
                  --path $(Build.SourcesDirectory)/artifact/updatedartifact/
                ;;
          esac  
        fi

