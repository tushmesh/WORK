# Starter pipeline
# Start with a minimal pipeline that you can customize to build and deploy your code.
# Add steps that build, run tests, deploy, and more:
# https://aka.ms/yaml

parameters:
  - name: DR_Enable
    displayName: "Do you want to enable DR?"
    values:
      - Yes
      - No
  - name: Primary_region_accessible
    displayName: "Is primary region accessible?"
    values:
      - Yes
      - No
  
variables:
 - group: CICD_VARIABLES
   
pool:
  vmImage: ubuntu-latest

stages:
  - stage: 'ManualDeploy_PRDandDR'
    displayName: 'Manual deploy of PRD and DR '
    jobs:
## Call template yml for AzureDatafactory
      - job: LA1
        displayName: 'LogicApps - AzureDatafactory'
        
        steps:
         
          - ${{if eq( variables['Build.SourceBranch'], 'refs/heads/master' )}}:
              
              - task: AzureResourceManagerTemplateDeployment@3
                displayName: 'AzureDataFactory LogicApp Prod deployment'
                condition: and(succeeded(), eq('${{ parameters.Primary_region_accessible }}', 'Yes'))
                inputs:
                  azureResourceManagerConnection: 'SPN_LogicApp'
                  subscriptionId: '$(azureSubscription)'
                  resourceGroupName: '$(prdresgroup)'
                  location: 'West Europe'
                  csmFile: '$(System.DefaultWorkingDirectory)/Components/AzureDataFactory/TPM_C1_AzureDataFactory_Template.json'
                  csmParametersFile: '$(System.DefaultWorkingDirectory)/Orchestrators/ARABIA/ComponentParams/TPM_ARABIA_PRD_C1_AzureDataFactory_Parameters.json' # parameter file name for production will be different
                  templateLocation: 'Linked artifact'
                  deploymentMode: 'Incremental'

              

              - task: AzureResourceManagerTemplateDeployment@3
                displayName: AzureDataFactory LogicApp deployment on DR
                inputs:
                  azureResourceManagerConnection: SPN_LogicApp
                  subscriptionId: '$(azureSubscription)'
                  resourceGroupName: '$(drresgroup)'
                  location: 'North Europe'
                  csmFile: '$(System.DefaultWorkingDirectory)/Components/AzureDataFactory/TPM_C1_AzureDataFactory_Template.json'
                  csmParametersFile: '$(System.DefaultWorkingDirectory)/Orchestrators/ARABIA/ComponentParams/TPM_ARABIA_DR_C1_AzureDataFactory_Parameters.json' # parameter file name for DR will be different
                  templateLocation: 'Linked artifact'
                  deploymentMode: 'Incremental'


## Call template yml for Database
      - job: LA2
        displayName: 'LogicApps - Database'
        
        steps:
          
          - ${{if eq( variables['Build.SourceBranch'], 'refs/heads/master' )}}:
             
              - task: AzureCLI@2
                continueOnError: false
                displayName: 'Database Azure CLI to deploy  LA - PRD' 
                condition: and(succeeded(), eq('${{ parameters.Primary_region_accessible }}', 'Yes'))
                inputs:
                    azureSubscription: SPN_LogicApp
                    scriptType: pscore
                    scriptLocation: inlineScript
                    inlineScript: | 
                          az  deployment group create --name 'TPM_ARABIA_PRD_C2_Database' -g $(prdresgroup) --template-file '$(System.DefaultWorkingDirectory)/Components/Database/TPM_DACH_C2_Database_Template.json' --parameters '$(System.DefaultWorkingDirectory)/Orchestrators/ARABIA/ComponentParams/TPM_ARABIA_PRD_C2_Database_Parameters.json' --mode Incremental
                    

             

              - task: AzureCLI@2
                continueOnError: false
                displayName: 'Database Azure CLI to deploy LA - DR' 
                inputs:
                    azureSubscription: SPN_LogicApp
                    scriptType: pscore
                    scriptLocation: inlineScript
                    inlineScript: | 
                          az  deployment group create --name 'TPM_ARABIA_PRD_C2_Database' -g $(drresgroup) --template-file '$(System.DefaultWorkingDirectory)/Components/Database/TPM_DACH_C2_Database_Template.json' --parameters '$(System.DefaultWorkingDirectory)/Orchestrators/ARABIA/ComponentParams/TPM_ARABIA_DR_C2_Database_Parameters.json' --mode Incremental


# ## Call template yml for LogAnalytics..
      - job: LA3
