          # Change branch to master from master and the source
          - ${{if eq( variables['Build.SourceBranch'], 'refs/heads/master' )}}:
              - task: cmdLine@2
                
                
              - task: AzureCLI@2
                continueOnError: false
                displayName: 'LogAnalytics Azure CLI to deploy LA - PRD'
                condition: and(succeeded(), eq('${{ parameters.Primary_region_accessible }}', 'Yes')) 
                inputs:
                  azureSubscription: SPN_LogicApp
                  scriptType: pscore
                  scriptLocation: inlineScript
                  inlineScript: | 
                    az deployment group create --name 'TPM_ARABIA_PRD_C7_LogAnalytics' -g $(prdresgroup) --template-file '$(System.DefaultWorkingDirectory)/Components/LogAnalytics/TPM_C7_LogAnalytics_Template.json' --parameters '$(System.DefaultWorkingDirectory)/Orchestrators/ARABIA/ComponentParams/TPM_ARABIA_PRD_C7_LogAnalytics_Parameters.json' --mode Incremental

              

              - task: AzureCLI@2
                continueOnError: false
                displayName: 'LogAnalytics Azure CLI to deploy LA - DR' 
                inputs:
                  azureSubscription: SPN_LogicApp
                  scriptType: pscore
                  scriptLocation: inlineScript
