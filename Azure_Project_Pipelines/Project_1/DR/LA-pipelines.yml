# Starter pipeline
# Start with a minimal pipeline that you can customize to build and deploy your code.
# Add steps that build, run tests, deploy, and more:
# https://aka.ms/yaml

trigger:
  branches:
    include:
      - develop
      - SQA
      - PPD
      - master
  paths:
    include:
      - Components/*
      - Orchestrators/ARABIA/Orchestrators/*    #this path is for other logic apps to be devloped.
    exclude:                  # exclude 2 folders from components which are not part of logic apps..!
      - Components/GZipExtractandTransform/*
      - Components/BlobStorageExternal/*

variables:
 - group: CICD_VARIABLES
 
pool:
  vmImage: ubuntu-latest

stages:
  - stage: 'GetChangeSet'
    displayName: 'Get ChangeSet'
    jobs:
      - job: 'ChangeSet'
        displayName: 'ChangeSet'
        steps:

          - task: CmdLine@2
            displayName: 'Check Diff'
            name: setupvariable
            inputs:
              script: |
                git diff --name-only  HEAD~1 HEAD > $(System.DefaultWorkingDirectory)/changeset.txt
                cat $(System.DefaultWorkingDirectory)/changeset.txt
                LA1="$(grep -w 'Components/AzureDataFactory'  $(System.DefaultWorkingDirectory)/changeset.txt)"
                LA2="$(grep -w 'Components/Database' $(System.DefaultWorkingDirectory)/changeset.txt)"
                LA3="$(grep -w 'Components/LogAnalytics' $(System.DefaultWorkingDirectory)/changeset.txt)"
                LA4="$(grep -w 'Components/Mail' $(System.DefaultWorkingDirectory)/changeset.txt)"
                LA5="$(grep -w 'Components/Mulesoft' $(System.DefaultWorkingDirectory)/changeset.txt)"
                LA6="$(grep -w 'Components/SalesforceUsingToken' $(System.DefaultWorkingDirectory)/changeset.txt)"
                LA7="$(grep -w 'Orchestrators/ARABIA/Orchestrators/O1_NightlyJob_COLD' $(System.DefaultWorkingDirectory)/changeset.txt)"
                LA8="$(grep -w 'Orchestrators/ARABIA/Orchestrators/O1_NightlyJob_HOT' $(System.DefaultWorkingDirectory)/changeset.txt)"
                LA9="$(grep -w 'Orchestrators/ARABIA/Orchestrators/O1_NightlyJob_WARM' $(System.DefaultWorkingDirectory)/changeset.txt)"
                LA10="$(grep -w 'Orchestrators/ARABIA/Orchestrators/O2_Customer' $(System.DefaultWorkingDirectory)/changeset.txt)"
                LA11="$(grep -w 'Orchestrators/ARABIA/Orchestrators/O3_Products' $(System.DefaultWorkingDirectory)/changeset.txt)"
                LA12="$(grep -w 'Orchestrators/ARABIA/Orchestrators/O6_Baseline' $(System.DefaultWorkingDirectory)/changeset.txt)"
                LA13="$(grep -w 'Orchestrators/ARABIA/Orchestrators/O7_Listprice_AWS' $(System.DefaultWorkingDirectory)/changeset.txt)"
                LA14="$(grep -w 'Orchestrators/ARABIA/Orchestrators/O4_SFDataSync' $(System.DefaultWorkingDirectory)/changeset.txt)"
                LA15="$(grep -w 'Orchestrators/ARABIA/Orchestrators/O5_Products_UOM' $(System.DefaultWorkingDirectory)/changeset.txt)"
                LA16="$(grep -w 'Orchestrators/ARABIA/Orchestrators/O9_SCC' $(System.DefaultWorkingDirectory)/changeset.txt)"
                LA17="$(grep -w 'Orchestrators/ARABIA/Orchestrators/O10_IMS' $(System.DefaultWorkingDirectory)/changeset.txt)"
                LA18="$(grep -w 'Orchestrators/ARABIA/Orchestrators/O11_PromotionalActuals' $(System.DefaultWorkingDirectory)/changeset.txt)"
