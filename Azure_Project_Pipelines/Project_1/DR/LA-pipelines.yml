## Call template yml for AzureDatafactory
      - job: LA1
        displayName: 'LogicApps - AzureDatafactory'
        variables:
          LAADF: $[dependencies.ChangeSet.outputs['setupvariable.LA1']]
        condition: and(succeeded(), eq(variables.LAADF, 'yes'))
        dependsOn: ChangeSet
        steps:
          - ${{if eq( variables['Build.SourceBranch'], 'refs/heads/develop' )}}:
            - template: DevOps/LA1_ADF.yml
              parameters:
                source: develop
             #   live: true
 
          - ${{if eq( variables['Build.SourceBranch'], 'refs/heads/SQA' )}}:
            - template: DevOps/LA1_ADF.yml
              parameters:
                source: SQA
          

          - ${{if eq( variables['Build.SourceBranch'], 'refs/heads/PPD' )}}:
            - template: DevOps/LA1_ADF.yml
              parameters:
                source: PPD

          - ${{if eq( variables['Build.SourceBranch'], 'refs/heads/master' )}}:
            - template: DevOps/LA1_ADF.yml
              parameters:
                source: master

