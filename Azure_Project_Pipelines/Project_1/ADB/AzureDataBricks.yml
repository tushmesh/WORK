## PROD Deployment 

- ${{if eq( variables['Build.SourceBranch'], 'refs/heads/master' )}}:
  - stage: CD
    displayName: 'ADB Deployment for PROD'
    dependsOn: CI
    jobs:
    - deployment: Approval
      displayName: 'Awaiting for Approval for PROD'
      environment: PROD
      strategy:
       runOnce:
         deploy:
           steps:

             - checkout: ReleaseAdmin
               path: s/ReleaseAdmin
               clean: false
                
             - checkout: Self
               clean: false
               path: s/SubjectArea

# Load Variables
             - task: PowerShell@2
               name: SLV
               displayName: Load Variables from JSON configuration - Subject Area
               inputs:
                filePath: $(System.DefaultWorkingDirectory)/ReleaseAdmin/Scripts/SubjectArea_LoadLocalVariables.ps1
                targetType: filePath
             - task: PowerShell@2
               name: CLV
               displayName: Load Variables from JSON configuration - Global
               inputs:
                filePath: $(System.DefaultWorkingDirectory)/ReleaseAdmin/Scripts/Common_LoadGlobalVariables.ps1
                targetType: filePath
            
             - task: AzurePowerShell@5
               displayName: 'Get Token'
               inputs:
                azureSubscription: $(prodservicename)
                ScriptType: 'InlineScript'
                Inline: |
                  $token = (Get-AzKeyVaultSecret -VaultName "$(json.KeyVaultPrefix)-$(json.ResourcePrefixPROD)-prd" -Name "$(json.DatabricksClusterSecretNamePROD)" -AsPlainText)
                  write-Host "##vso[task.setvariable variable=adb_token;]$token"
                azurePowerShellVersion: 'LatestVersion'

             - task: configuredatabricks@0
               displayName: "Configuring Databricks workspace"
               continueOnError: false
               inputs:
                    url: '$(json.ADBUrl)'
                    token: '$(adb_token)'
             - task: databricksDeployScripts@0
               displayName: 'Databricks Notebooks deployment'
               inputs:
                  bearerToken: '$(adb_token)'
                  localPath: '$(System.DefaultWorkingDirectory)/SubjectArea/ADB/'
                  databricksPath: $(adb_Path)
                  clean: true

             - task: PowerShell@2
               displayName: 'Tag Repo'
               inputs:
                 targetType: inline
                 script: |
                    cd $(System.DefaultWorkingDirectory)/SubjectArea
                    $commitAuthorName=$(git log --format='%an' $(Build.SourceVersion))
                    $commitAuthorEmail=$(git log --format='%ae' $(Build.SourceVersion))
                    git config user.email "$commitAuthorEmail"
                    git config user.name "$commitAuthorName"
                    $date=$(Get-Date -Format yyyy-MM-dd_HH.mm);
                    git remote set-url origin https://$(PATTOKEN)@$(GITURL)
                    git tag -a ADB_$date -m "ADB Prod deployment on $date"
                    git push origin --tags
