                inputs:
                  azureSubscription: '$(devservicename)'
                  ServerName: 'sql-msfnex20-01.database.windows.net'
                  DatabaseName: 'sqldb-msfnex20-10_enriched-dev'
                  SqlUsername: 'DB_SUPPORT_MAINT_DBDPL'
                  SqlPassword: $(DB-SUPPORT-MAINT-DBDPL)
                  deploymentAction: script
                  deployType: DacpacTask
                  DacpacFile: '$(System.DefaultWorkingDirectory)/SQL/ENRICHED/$(subname)-ENRICHED/bin/Debug/$(filebase_e).dacpac'
                  PublishProfile:  '$(System.DefaultWorkingDirectory)/SQL/ENRICHED/$(subname)-ENRICHED/DEV_PUBLISH_CFG/DB_PROJECT.publish_DEV.publish.xml'
                  IpDetectionMethod: AutoDetect

## Deploy ENRICHED - DEV
              #- task: SqlAzureDacpacDeployment@1
                #condition: and (succeeded(), eq (variables.localenriched, 'True'))
                #displayName: 'Deploy ENRICHED - DEV'
                #inputs:
                  #azureSubscription: '$(devservicename)'
                  #ServerName: 'sql-msfnex20-01.database.windows.net'
                  #DatabaseName: 'sqldb-msfnex20-10_enriched-dev'
                  #SqlUsername: 'DB_SUPPORT_MAINT_DBDPL'
                  #SqlPassword: $(DB-SUPPORT-MAINT-DBDPL)
                  #deployType: SqlTask
                  #SqlFile: $(System.DefaultWorkingDirectory)/GeneratedOutputFiles/sqldb-msfnex20-10_enriched-dev_Script.sql

## Archive for SQL Enriched - DEV
              - task: ArchiveFiles@2
                displayName: 'Archieve ENRICHED Sql - DEV'
                condition: and (succeeded(), eq (variables.localenriched, 'True'))
                inputs:
                    rootFolderOrFile: '$(System.DefaultWorkingDirectory)/GeneratedOutputFiles/sqldb-msfnex20-10_enriched-dev_Script.sql'
